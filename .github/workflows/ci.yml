name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same PR cancels the run still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # mongodb-memory-server downloads a mongod binary on first use; caching it
      # keeps subsequent runs from re-fetching ~100MB.
      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      # postinstall builds @cairn/shared, which the other workspaces import.
      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Catches anything that type-checks but fails to emit.
      - name: Build
        run: npm run build
