server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # nginx's add_header does not merge: a location that declares any add_header
    # of its own discards every one inherited from the server block. Both cache
    # locations below set one, so the security headers are repeated in each
    # rather than written once here. Removing a repetition silently drops the
    # headers for that path.
    include /etc/nginx/conf.d/security-headers.inc;

    # Hashed asset filenames change whenever their contents do, so they can be
    # cached indefinitely.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves browsers loading old
    # HTML that points at asset hashes which no longer exist.
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Lets the container report healthy without serving the whole app.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Client-side routing: /repo/abc123 is a React route, not a file on disk,
    # so anything unmatched falls through to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
